$kind: http-request
url: "{{base_url}}/api/logout"
method: POST
body:
  type: json
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Logout success\", function () {\r

      \    pm.expect(pm.response.code).to.be.oneOf([200, 204]);\r

      });"
    language: text/javascript
order: 3000
